name: Build Project Aydin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesin PS1 (Jalur Cepat - Anti Gagal)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake
          
          echo "Download Mesin Jadi..."
          wget -q https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/gcc-mipsel-none-elf-12.3.0-linux.zip
          wget -q https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip
          
          echo "Pasang ke Server..."
          sudo unzip -q -o gcc-mipsel-none-elf-12.3.0-linux.zip -d /usr/local/
          sudo unzip -q -o PSn00bSDK-0.24-Linux.zip -d /usr/local/

      - name: Siapkan Konfigurasi CMake Otomatis
        run: |
          echo 'cmake_minimum_required(VERSION 3.21)' > CMakeLists.txt
          echo 'set(CMAKE_TOOLCHAIN_FILE "/usr/local/lib/libpsn00b/cmake/sdk.cmake")' >> CMakeLists.txt
          echo 'project(AydinProject)' >> CMakeLists.txt
          echo 'psn00bsdk_add_executable(aydin STATIC main.c)' >> CMakeLists.txt

      - name: Rakit Game
        run: |
          export PATH=$PATH:/usr/local/bin
          export PSN00BSDK_LIBS=/usr/local/lib/libpsn00b
          mkdir build && cd build
          cmake ..
          make

      - name: Simpan File Game Siap Main
        uses: actions/upload-artifact@v4
        with:
          name: Game-Aydin-Jakarta-Utara
          path: build/aydin.exe
