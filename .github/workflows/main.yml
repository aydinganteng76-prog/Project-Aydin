name: Build Project Aydin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesin PS1 & Alat CD
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip cmake make build-essential genisoimage cdrdao python3
          
          wget -q https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/gcc-mipsel-none-elf-12.3.0-linux.zip
          wget -q https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip
          
          sudo unzip -q -o gcc-mipsel-none-elf-12.3.0-linux.zip -d /usr/local/
          sudo unzip -q -o PSn00bSDK-0.24-Linux.zip -d /usr/local/

      - name: Siapkan Konfigurasi CMake
        run: |
          TOOLCHAIN_PATH=$(find /usr/local -name "sdk.cmake" | head -n 1)
          echo "cmake_minimum_required(VERSION 3.21)" > CMakeLists.txt
          echo "set(CMAKE_TOOLCHAIN_FILE \"$TOOLCHAIN_PATH\")" >> CMakeLists.txt
          echo "project(AydinProject)" >> CMakeLists.txt
          echo "psn00bsdk_add_executable(aydin STATIC main.c)" >> CMakeLists.txt

      - name: Rakit Game & Bungkus Jadi CUE/BIN Resmi
        run: |
          export PATH=$PATH:/usr/local/bin
          LIB_PATH=$(find /usr/local -type d -name "libpsn00b" | head -n 1)
          export PSN00BSDK_LIBS=$LIB_PATH
          
          mkdir build && cd build
          cmake ..
          make
          
          rm -rf ../cdroot && mkdir -p ../cdroot
          cp aydin.exe ../cdroot/AYDIN.EXE
          printf "BOOT = cdrom:\\\\AYDIN.EXE;1\r\nTCB = 4\r\nEVENT = 16\r\nSTACK = 801FFFF0\r\n" > ../cdroot/SYSTEM.CNF
          
          cd ..
          # Bikin file ISO mentah dulu
          genisoimage -o aydin_disc.iso -V "AYDIN_GAME" -iso-level 1 cdroot/
          
          # Konversi ISO mentah jadi format CUE/BIN PS1 murni pakai cdrdao
          toc2cue aydin_disc.iso aydin_game.cue || true
          
          # Kalau toc2cue gak ada, kita buat file .cue manual secara bersih
          echo 'FILE "aydin_disc.iso" BINARY' > aydin.cue
          echo '  TRACK 01 MODE2/2352' >> aydin.cue
          echo '    INDEX 01 00:00:00' >> aydin.cue

      - name: Simpan Kaset Game CUE/BIN
        uses: actions/upload-artifact@v4
        with:
          name: Game-Aydin-Jakarta-Utara-Disc
          path: |
            aydin_disc.iso
            aydin.cue
